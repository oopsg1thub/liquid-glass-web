<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Music Player · Liquid Glass Web</title>
  <link rel="icon" href="data:,">
  <style>
{{GLASS_CSS}}
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 20rem;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .player {
      width: min(92vw, 24rem);
      padding: 1.5rem;
      display: grid;
      gap: 1.1rem;
    }
    .art {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 18px;
      background:
        radial-gradient(120% 90% at 20% 15%, rgb(255 255 255 / 0.35), transparent 50%),
        conic-gradient(from 230deg at 60% 40%, var(--hue-a), var(--hue-c), var(--hue-d), var(--hue-b), var(--hue-a));
      box-shadow: inset 0 1px 1px rgb(255 255 255 / 0.55), 0 14px 34px rgb(20 16 60 / 0.35);
    }
    .meta { display: grid; gap: 0.15rem; }
    h1 { margin: 0; font-size: 1.22rem; line-height: 1.2; letter-spacing: -0.02em; }
    .artist { margin: 0; color: var(--ink-dim); font-size: 0.95rem; font-weight: 500; letter-spacing: 0.01em; }
    .progress { display: grid; gap: 0.4rem; }
    .track {
      width: 100%;
      height: 6px;
      padding: 0;
      overflow: hidden;
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ink) 14%, transparent);
    }
    .track::-webkit-progress-bar { background: color-mix(in srgb, var(--ink) 14%, transparent); border-radius: inherit; }
    .track::-webkit-progress-value { background: var(--accent); border-radius: inherit; }
    .track::-moz-progress-bar { background: var(--accent); border-radius: inherit; }
    .times {
      display: flex;
      justify-content: space-between;
      color: var(--ink-dim);
      font-size: 0.8rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }
    .transport { display: flex; align-items: center; justify-content: center; gap: 0.9rem; }
    .transport-button { width: 2.7rem; height: 2.7rem; padding: 0; justify-content: center; font-size: 1rem; }
    .play { width: 3.4rem; height: 3.4rem; font-size: 1.25rem; }
    .statusbar { display: flex; align-items: center; justify-content: flex-end; gap: 0.6rem; }
    @media print {
      .transport, .statusbar { display: none; }
      .player { width: 22rem; }
    }
  </style>
</head>
<body>
  <div class="lg-backdrop" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span>
  </div>

  <main class="lg lg--thick lg-materialize player" style="--enter-delay: 0.1s;" aria-labelledby="trackTitle">
    <div class="art" aria-hidden="true"></div>
    <div class="meta">
      <h1 id="trackTitle">Cathedrals of Light</h1>
      <p class="artist">Aurora Vale · Refractions</p>
    </div>

    <div class="progress">
      <progress class="track" id="progress" value="0" max="227" aria-label="Playback progress">0 of 227 seconds</progress>
      <div class="times">
        <span id="timeNow" aria-live="off">0:00</span>
        <span>3:47</span>
      </div>
    </div>

    <div class="transport" role="group" aria-label="Playback controls">
      <button class="lg-chip transport-button" id="previous" type="button" aria-label="Previous track">⏮</button>
      <button class="lg-chip lg-cta transport-button play" id="play" type="button" aria-label="Play" aria-pressed="false">▶</button>
      <button class="lg-chip transport-button" id="next" type="button" aria-label="Next track">⏭</button>
    </div>

    <div class="statusbar">
      <button class="lg-chip" id="themeToggle" type="button" aria-label="Toggle color theme">◐</button>
    </div>
  </main>

{{REFRACTION_SNIPPET}}
  <script>
    /* Demo player logic intentionally lives after the canonical snippet. */
    (function () {
      var duration = 227;
      var elapsed = 0;
      var timer = null;
      var play = document.getElementById("play");
      var timeNow = document.getElementById("timeNow");
      var progress = document.getElementById("progress");

      function formatTime(seconds) {
        return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
      }

      function render() {
        timeNow.textContent = formatTime(elapsed);
        progress.value = elapsed;
        progress.setAttribute("aria-valuetext", formatTime(elapsed) + " of 3:47");
      }

      function pause() {
        clearInterval(timer);
        timer = null;
        play.textContent = "▶";
        play.setAttribute("aria-label", "Play");
        play.setAttribute("aria-pressed", "false");
      }

      function start() {
        play.textContent = "⏸";
        play.setAttribute("aria-label", "Pause");
        play.setAttribute("aria-pressed", "true");
        timer = setInterval(function () {
          elapsed += 1;
          if (elapsed >= duration) {
            elapsed = duration;
            render();
            pause();
            return;
          }
          render();
        }, 1000);
      }

      play.addEventListener("click", function () { timer ? pause() : start(); });
      document.getElementById("previous").addEventListener("click", function () { elapsed = 0; render(); });
      document.getElementById("next").addEventListener("click", function () { elapsed = 0; render(); pause(); });
      render();
    })();
  </script>
</body>
</html>
