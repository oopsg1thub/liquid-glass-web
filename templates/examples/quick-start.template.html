<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Quick Start · Liquid Glass Web</title>
  <link rel="icon" href="data:,">
  <style>
{{GLASS_CSS}}
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 20rem; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .skip {
      position: fixed;
      left: 1rem;
      top: 1rem;
      z-index: 50;
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
      color: var(--accent-ink);
      background: var(--accent);
      transform: translateY(-180%);
    }
    .skip:focus { transform: translateY(0); }
    .nav {
      --lg-radius: 999px;
      position: sticky;
      top: 0.85rem;
      z-index: 20;
      width: min(56rem, calc(100% - 1.5rem));
      margin: 0.85rem auto 0;
      padding: 0.55rem 0.65rem 0.55rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .brand { margin-right: auto; font-weight: 750; letter-spacing: -0.02em; }
    main {
      min-height: calc(100vh - 5rem);
      display: grid;
      place-items: center;
      padding: clamp(3rem, 10vw, 7rem) 1rem;
    }
    .hero {
      width: min(46rem, 100%);
      padding: clamp(1.5rem, 5vw, 3.25rem);
    }
    .eyebrow {
      margin: 0 0 0.8rem;
      color: var(--ink-dim);
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(2.5rem, 9vw, 5.5rem);
      line-height: 0.96;
      letter-spacing: -0.055em;
    }
    .lede {
      max-width: 58ch;
      margin: 1.25rem 0 0;
      color: var(--ink-dim);
      font-size: clamp(1rem, 2vw, 1.16rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 1.5rem; }
    @media (max-width: 32rem) {
      .nav { padding-left: 0.8rem; }
    }
    @media print {
      .skip, .nav, .actions { display: none !important; }
      main { min-height: auto; padding: 0; }
      .hero { width: 100%; padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="lg-backdrop" aria-hidden="true">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span>
  </div>

  <nav class="lg lg--thin lg-materialize nav" aria-label="Demo controls">
    <span class="brand">Liquid Glass</span>
    <button class="lg-chip" id="themeToggle" type="button" aria-label="Toggle color theme">◐</button>
  </nav>

  <main id="content">
    <article class="lg lg--thick lg-materialize hero" style="--enter-delay: 0.12s;">
      <p class="eyebrow">Canonical quick start</p>
      <h1>Glass that keeps its depth.</h1>
      <p class="lede">
        One material, three layers: a reliable frosted baseline, Chromium refraction,
        and a restrained specular rim that responds to the pointer.
      </p>
      <div class="actions">
        <button class="lg-chip lg-cta" type="button">Primary action</button>
        <a class="lg-chip" href="#content">Read the surface</a>
      </div>
    </article>
  </main>

{{REFRACTION_SNIPPET}}
</body>
</html>
