name: Validate and deploy Pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_SKILLS_SHA: 38a2ff82958afee88dadf4831509e6f7e9d8ef4e
  OPENAI_SKILLS_SHA: 49f948faa9258a0c61caceaf225e179651397431

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository tools
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate Agent Skills structure
        run: |
          python -m pip install "git+https://github.com/agentskills/agentskills.git@${AGENT_SKILLS_SHA}#subdirectory=skills-ref"
          skills-ref validate skills/liquid-glass-web

      - name: Run Codex quick validator
        run: |
          python -m pip install PyYAML
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/openai/skills/${OPENAI_SKILLS_SHA}/skills/.system/skill-creator/scripts/quick_validate.py" \
            --output "${RUNNER_TEMP}/quick_validate.py"
          python "${RUNNER_TEMP}/quick_validate.py" skills/liquid-glass-web

      - name: Run project, browser, and accessibility tests
        run: npm test

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-dist

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
